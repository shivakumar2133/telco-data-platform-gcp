# Pull requests that change infrastructure get a Terraform plan as a PR comment.
# The job authenticates with Workload Identity Federation (no key) as sa-cicd,
# which can read resource metadata but no data, and cannot change anything.
# Applying stays a human step after review: `make tf-apply`.
name: Terraform plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write       # lets the job request a GitHub OIDC token for WIF
  pull-requests: write  # post the plan as a comment

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan
    # Pull requests from forks get no cloud access at all
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_developer_email: ${{ vars.DEVELOPER_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: init
        run: >
          terraform -chdir=infra/terraform init -input=false
          -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
          -backend-config="prefix=envs/dev"

      # -lock=false: a read-only identity can't take the state lock; plans don't change state
      - name: plan
        id: plan
        run: |
          set +e
          terraform -chdir=infra/terraform plan -input=false -lock=false -no-color \
            -var-file=envs/dev.tfvars -detailed-exitcode > plan.txt 2>&1
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tail -n 40 plan.txt
          # 0 = no changes, 2 = changes; anything else is an error
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]

      - name: comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          summary=$(grep -E '^(Plan:|No changes\.|Error:)' plan.txt | head -n 5)
          {
            echo "### Terraform plan (exit code ${CODE:-?})"
            echo
            echo "${summary:-See the job log.}"
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
            echo
            echo "_Applied by a human after review: \`make tf-apply\`._"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none
