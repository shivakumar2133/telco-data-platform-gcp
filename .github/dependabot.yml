# Keeps third-party versions current with small, reviewable pull requests (CI runs on each).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    ignore:
      # Major provider versions are breaking: upgrade deliberately, not by bot
      - dependency-name: "hashicorp/google"
        update-types: ["version-update:semver-major"]
