[project]
name = "telco-data-platform-gcp"
version = "0.1.0"
description = "End-to-end GCP data engineering platform on synthetic telecom data"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
