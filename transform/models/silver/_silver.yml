version: 2

# Tests here prove the Silver logic, not the source data quality (that is Phase 7):
#   unique + not_null on keys       -> deduplication of Bronze versions works
#   keys_match_source               -> every Bronze key made it to Silver (reconciliation)
#   accepted_values                 -> standardisation works
#   relationships (severity: warn)  -> known source defects are REPORTED, not hidden

models:
  - name: crm_customers
    description: Current state of every CRM customer. One row per customer_id.
    columns:
      - name: customer_id
        description: CRM customer key.
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'mssql__customers')
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'SUSPENDED', 'CEASED']
      - name: email
        description: Lower-cased and trimmed. NULL for some records (known source defect).
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_EMAIL', 'unset') }}"]
      - name: first_name
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_NAME', 'unset') }}"]
      - name: last_name
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_NAME', 'unset') }}"]
      - name: address_line1
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_NAME', 'unset') }}"]
      - name: msisdn
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_PHONE', 'unset') }}"]
      - name: date_of_birth
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_BIRTH_DATE', 'unset') }}"]
      - name: postcode
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_POSTCODE', 'unset') }}"]
      - name: is_valid_email
        description: FALSE when email is missing or malformed.
      - name: is_valid_postcode
        description: FALSE when postcode does not match the UK format.

  - name: crm_products
    description: Current product catalogue.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'mssql__products')

  - name: crm_subscriptions
    description: Current state of every subscription.
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'mssql__subscriptions')
      - name: msisdn
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_PHONE', 'unset') }}"]
      - name: customer_id
        description: Some point to customers that no longer exist (orphans, a known CRM defect).
        data_tests:
          - relationships:
              arguments:
                to: ref('crm_customers')
                field: customer_id
              config:
                severity: warn
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('crm_products')
                field: product_id

  - name: billing_accounts
    description: Current state of every billing account (one per customer).
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'oracle__billing_accounts')

  - name: billing_invoices
    description: Current state of every invoice. Partitioned by billing month.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'oracle__invoices')
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('billing_accounts')
                field: account_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['PAID', 'PARTIALLY_PAID', 'OVERDUE', 'ISSUED']

  - name: billing_invoice_lines
    description: Invoice lines (recurring, usage and one-off charges).
    columns:
      - name: line_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'oracle__invoice_lines')
      - name: invoice_id
        data_tests:
          - relationships:
              arguments:
                to: ref('billing_invoices')
                field: invoice_id
      - name: charge_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['RECURRING', 'USAGE', 'ONEOFF']

  - name: billing_payments
    description: Payments received against invoices.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'oracle__payments')
      - name: invoice_id
        data_tests:
          - relationships:
              arguments:
                to: ref('billing_invoices')
                field: invoice_id

  - name: network_sites
    description: Current state of every network site.
    columns:
      - name: site_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'postgres__sites')

  - name: network_cells
    description: Current state of every radio cell.
    columns:
      - name: cell_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'postgres__cells')
      - name: site_id
        data_tests:
          - relationships:
              arguments:
                to: ref('network_sites')
                field: site_id

  - name: network_devices
    description: Current state of every network device.
    columns:
      - name: device_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'postgres__devices')

  - name: usage_cdrs
    description: >
      One row per call detail record, partitioned by the day of the call. Duplicate
      deliveries are collapsed; late arrivals are flagged (is_late_arrival).
    columns:
      - name: cdr_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'files__cdr')
      - name: call_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['VOICE', 'SMS', 'DATA']
      - name: call_result
        data_tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'DROPPED', 'FAILED']
      - name: call_date
        description: Day the call happened (partition column).
      - name: is_late_arrival
        description: TRUE when the record arrived in a later day's file.
      - name: msisdn_a
        description: Calling number.
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_PHONE', 'unset') }}"]
      - name: msisdn_b
        description: Called number.
        policy_tags: ["{{ env_var('DBT_POLICY_TAG_PHONE', 'unset') }}"]
      - name: dq_negative_duration
        description: TRUE when duration_sec < 0 (known mediation defect).

  - name: network_alarms
    description: One row per alarm; re-exported alarms keep the latest export.
    columns:
      - name: alarm_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'files__alarms')
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values: ['CRITICAL', 'MAJOR', 'MINOR', 'WARNING']
      - name: dq_cleared_before_raised
        description: TRUE when cleared_at < raised_at (known NMS defect).

  - name: service_tickets
    description: Current state of every trouble ticket.
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null
          - keys_match_source:
              arguments:
                source_relation: source('bronze', 'api__tickets')
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: ['P1', 'P2', 'P3', 'P4']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['NEW', 'IN_PROGRESS', 'RESOLVED', 'CLOSED']

  - name: service_sla_targets
    description: SLA response/resolution targets per service tier and priority (cleaned workbook).
    columns:
      - name: sla_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Premium', 'Enhanced', 'Standard']
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: ['P1', 'P2', 'P3', 'P4']
      - name: resolution_hours
        description: Parsed from text where needed ("24 hrs" -> 24).
        data_tests:
          - not_null
      - name: availability_target_pct
        description: Always a percentage (0.999 in the workbook becomes 99.9).
