name: telco
version: "1.0.0"
config-version: 2
profile: telco

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]

models:
  telco:
    # Column and table descriptions are written into BigQuery itself
    +persist_docs:
      relation: true
      columns: true
    staging:
      # Thin views over Bronze: rename, cast, clean, flag. No storage cost.
      +materialized: view
      +schema: silver
      +tags: ["staging"]
      +labels: {layer: silver, kind: staging}
    silver:
      # Current-state tables, updated by MERGE with only the new Bronze rows
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
      +schema: silver
      +tags: ["silver"]
      +labels: {layer: silver}
    gold:
      # Star schema for BI tools. Read by sa-reporting only.
      +materialized: table
      +schema: gold
      +tags: ["gold"]
      +labels: {layer: gold}
    dq:
      # Data quality + reconciliation results. Append-only history in the ops dataset.
      +schema: ops
      +tags: ["dq"]
      +labels: {layer: ops, kind: dq}

snapshots:
  telco:
    +tags: ["silver", "scd2"]
    # needed for policy tags (column-level security) to be applied to snapshot columns
    +persist_docs:
      relation: true
      columns: true

# Fail fast if column-level security can't be applied (see macros/governance.sql)
on-run-start:
  - "{{ check_governance_env() }}"

vars:
  # Row-level security entitlements (Phase 8). Short service-account names: sa-<name>.
  # Everyone not listed sees no rows of the protected tables.
  rls_full_access: ["transform", "reporting"]
  rls_regions:
    "North West": ["analyst"]

data_tests:
  telco:
    +store_failures: false
